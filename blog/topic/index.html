<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Topic — AU_ Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A topic on the AU_ Journal.">
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/journal.css">
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <div class="scanline"></div>

  <nav class="nav stuck journal-nav" id="mainNav">
    <a href="/" class="journal-logo">AU<span class="dot">_</span><span class="slash">/</span><span class="jl">JOURNAL</span></a>
    <div class="nav-links">
      <a href="/" data-index="01">Home</a>
      <a href="/work.html" data-index="02">Work</a>
      <a href="/about.html" data-index="03">About</a>
      <a href="/blog/" data-index="04">Journal</a>
    </div>
    <div class="journal-nav-user" id="journalUser"></div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
    <a href="/">Home</a><a href="/work.html">Work</a><a href="/about.html">About</a><a href="/blog/">Journal</a>
    <div class="mobile-nav-foot">
      <a href="/blog/login/" class="btn-lime">Sign in →</a>
      <a href="/blog/dashboard/" class="btn-ghost-line">Dashboard</a>
    </div>
  </nav>

  <main id="topicMain"></main>

  <footer class="footer">
    <div class="footer-left">© <span id="yr"></span> <strong>Aditya Uniyal</strong> · Built from scratch.</div>
    <div class="footer-right">
      <a href="/privacy.html">Privacy</a>
      <a href="/blog/">Journal</a>
      <a href="/blog/rss.xml">RSS</a>
      <a href="https://www.linkedin.com/in/uniyaladitya" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

  <script src="/js/supabase-config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/journal-ui.js"></script>
  <script src="/js/journal-api.js"></script>
  <script src="/js/main.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const UI = window.UI;

    function slug() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const i = parts.indexOf('topic');
      if (i >= 0 && parts[i + 1]) return decodeURIComponent(parts[i + 1]);
      return UI.qs('t') || '';
    }

    async function boot() {
      await window.AUJournalReady;
      try { const s = await window.AUAuth.getSession(); UI.renderNavUser(s.user, s.profile); } catch (e) {}

      const s = slug();
      const main = $('topicMain');
      if (!window.SUPABASE_CONFIG.configured()) {
        main.innerHTML = '<div class="journal-top"><div class="container">' + UI.empty('Journal is not connected yet.', 'See the README for setup.') + '</div></div>';
        return;
      }
      const cats = await window.API.categories();
      const cat = (cats || []).find(c => c.slug === s);
      if (!cat) {
        main.innerHTML = '<div class="journal-top"><div class="container">' +
          UI.empty('Topic not found.', 'Browse all topics from the journal index.') +
          '<div style="text-align:center; margin-top:24px"><a class="btn-ghost-line" href="/blog/">← All topics</a></div></div></div>';
        return;
      }
      document.title = cat.name + ' — AU_ Journal';
      const posts = await window.API.postsByCategory(cat.slug, 24);
      const trending = posts.slice().sort((a, b) =>
        ((b.view_count || 0) + (b.like_count || 0) * 4) - ((a.view_count || 0) + (a.like_count || 0) * 4)).slice(0, 4);
      const tags = await window.API.tags(30);

      main.innerHTML =
        '<div class="journal-top">' +
          '<div class="container">' +
            '<div class="jt-label">topic</div>' +
            '<h1>' + UI.escapeHtml(cat.name) + '</h1>' +
            (cat.description ? '<p class="jt-sub">' + UI.escapeHtml(cat.description) + '</p>' : '') +
            '<div class="meta" style="margin-top:20px"><span><strong style="color:var(--bone)">' + posts.length + '</strong> articles</span></div>' +
          '</div>' +
        '</div>' +
        '<section class="jsection"><div class="container">' +
          '<div class="jsection-head"><div><div class="js-label">trending in ' + UI.escapeHtml(cat.name.toLowerCase()) + '</div><h2>Hot <em>here</em>.</h2></div></div>' +
          '<div id="topicTrending"></div>' +
        '</div></section>' +
        '<section class="jsection"><div class="container">' +
          '<div class="jsection-head"><div><div class="js-label">latest</div><h2>Latest <em>' + UI.escapeHtml(cat.name.toLowerCase()) + '</em> articles.</h2></div></div>' +
          '<div id="topicLatest"></div>' +
        '</div></section>' +
        '<section class="jsection"><div class="container">' +
          '<div class="jsection-head"><div><div class="js-label">explore</div><h2>Tags.</h2></div></div>' +
          '<div class="tag-cloud" id="topicTags"></div>' +
        '</div></section>';

      $('topicTrending').innerHTML = trending.length
        ? trending.map((p, i) => UI.postRow(p, i + 1)).join('')
        : UI.empty('No data yet.', 'No articles in this topic yet.', true);
      $('topicLatest').innerHTML = posts.length
        ? posts.map((p, i) => UI.postRow(p, i + 1)).join('')
        : UI.empty('No articles yet.', 'Published ' + cat.name.toLowerCase() + ' stories will appear here.');
      $('topicTags').innerHTML = tags.length
        ? tags.map(t => '<a class="topic-pill" href="/blog/search/?q=' + encodeURIComponent(t.name) + '">#' + UI.escapeHtml(t.name) + '</a>').join('')
        : UI.empty('No tags yet.', 'Tags come from published articles.', true);

      observeReveals();
    }

    function observeReveals() {
      window.UI.observeReveals();
    }

    boot();
  })();
  </script>
</body>
</html>
