[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'static site — no build step'"

[dev]
  functions = "netlify/functions"

# ── Journal clean URLs (/blog/...) → static files in /blog ──
# Directory index pages:
#   /blog/            → blog/index.html
#   /blog/search/     → blog/search/index.html
#   /blog/login/      → blog/login/index.html
#   /blog/dashboard/  → blog/dashboard/index.html (+ /editor/)
#   /blog/admin/      → blog/admin/index.html
# Dynamic segments are rewritten to their directory's index.html,
# which reads the slug client-side from the URL path.

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/post/*"
  to = "/blog/post/index.html"
  status = 200

[[redirects]]
  from = "/blog/author/*"
  to = "/blog/author/index.html"
  status = 200

[[redirects]]
  from = "/blog/topic/*"
  to = "/blog/topic/index.html"
  status = 200

[[redirects]]
  from = "/blog/series/*"
  to = "/blog/series/index.html"
  status = 200

# ── SEO endpoints (server-generated from Supabase) ──
[[redirects]]
  from = "/blog/sitemap.xml"
  to = "/.netlify/functions/journalSitemap"
  status = 200

[[redirects]]
  from = "/blog/rss.xml"
  to = "/.netlify/functions/journalRss"
  status = 200

# ── Existing Netlify function (unchanged) ──
# /sendFeedback is auto-exposed at /.netlify/functions/sendFeedback
# and any legacy alias keeps working.
[[redirects]]
  from = "/sendFeedback"
  to = "/.netlify/functions/sendFeedback"
  status = 200
