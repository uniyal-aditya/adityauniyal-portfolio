[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  framework = "#static"
  targetPort = 5173
  publish = "dist"
  functions = "netlify/functions"

# ── Legacy feedback function ──
[[redirects]]
  from = "/sendFeedback"
  to = "/.netlify/functions/sendFeedback"
  status = 200

# ── SEO endpoints (server-generated from Supabase) ──
[[redirects]]
  from = "/blog/sitemap.xml"
  to = "/.netlify/functions/journalSitemap"
  status = 200

[[redirects]]
  from = "/blog/rss.xml"
  to = "/.netlify/functions/journalRss"
  status = 200

# ── SPA catch-all ──
# All routes are client-side (React Router). Must come last so the
# function redirects above win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
