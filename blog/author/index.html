<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Author — AU_ Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An author on the AU_ Journal.">
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/journal.css">
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <div class="scanline"></div>

  <nav class="nav stuck journal-nav" id="mainNav">
    <a href="/" class="journal-logo">AU<span class="dot">_</span><span class="slash">/</span><span class="jl">JOURNAL</span></a>
    <div class="nav-links">
      <a href="/" data-index="01">Home</a>
      <a href="/work.html" data-index="02">Work</a>
      <a href="/about.html" data-index="03">About</a>
      <a href="/blog/" data-index="04">Journal</a>
    </div>
    <div class="journal-nav-user" id="journalUser"></div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
    <a href="/">Home</a><a href="/work.html">Work</a><a href="/about.html">About</a><a href="/blog/">Journal</a>
    <div class="mobile-nav-foot">
      <a href="/blog/login/" class="btn-lime">Sign in →</a>
      <a href="/blog/dashboard/" class="btn-ghost-line">Dashboard</a>
    </div>
  </nav>

  <main id="authorMain"></main>

  <footer class="footer">
    <div class="footer-left">© <span id="yr"></span> <strong>Aditya Uniyal</strong> · Built from scratch.</div>
    <div class="footer-right">
      <a href="/privacy.html">Privacy</a>
      <a href="/blog/">Journal</a>
      <a href="/blog/rss.xml">RSS</a>
      <a href="https://www.linkedin.com/in/uniyaladitya" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

  <script src="/js/supabase-config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/journal-ui.js"></script>
  <script src="/js/journal-api.js"></script>
  <script src="/js/main.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const UI = window.UI;

    function username() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const i = parts.indexOf('author');
      if (i >= 0 && parts[i + 1]) return decodeURIComponent(parts[i + 1]);
      return UI.qs('u') || '';
    }

    async function boot() {
      await window.AUJournalReady;
      try { const s = await window.AUAuth.getSession(); UI.renderNavUser(s.user, s.profile); } catch (e) {}

      const uname = username();
      const main = $('authorMain');
      if (!window.SUPABASE_CONFIG.configured()) {
        main.innerHTML = '<div class="journal-top"><div class="container">' + UI.empty('Journal is not connected yet.', 'See the README for setup.') + '</div></div>';
        return;
      }
      const profile = await window.API.profileByUsername(uname);
      if (!profile) {
        main.innerHTML = '<div class="journal-top"><div class="container">' +
          UI.empty('Author not found.', 'The profile may not exist.') +
          '<div style="text-align:center; margin-top:24px"><a class="btn-ghost-line" href="/blog/">← Back to Journal</a></div></div></div>';
        return;
      }
      document.title = (profile.display_name || profile.username) + ' — AU_ Journal';
      const stats = await window.API.authorStats(profile.id);
      const posts = await window.API.postsByAuthor(profile.username, 50);
      const sorted = posts.slice().sort((a, b) => (b.view_count || 0) - (a.view_count || 0));
      const isOwner = profile.username === window.SUPABASE_CONFIG.ownerUsername;

      const name = profile.display_name || profile.username;
      main.innerHTML =
        '<div class="journal-top">' +
          '<div class="container" style="display:flex; gap:32px; align-items:center; flex-wrap:wrap;">' +
            '<div>' + UI.avatar(profile, 96) + '</div>' +
            '<div style="flex:1; min-width:240px;">' +
              '<div class="jt-label" style="margin-bottom:12px">' + (isOwner ? 'portfolio owner' : 'author') + '</div>' +
              '<h1 style="font-size:clamp(2.4rem,6vw,4.4rem)">' + UI.escapeHtml(name) + UI.verifiedBadge(profile) + '</h1>' +
              (profile.bio ? '<p class="jt-sub" style="margin-top:14px">' + UI.escapeHtml(profile.bio) + '</p>' : '') +
              '<div class="meta" style="margin-top:18px">' +
                '<span><strong style="color:var(--bone)">' + stats.posts + '</strong> articles</span><span class="dot-sep">·</span>' +
                '<span><strong style="color:var(--bone)">' + UI.fmtNum(stats.followers) + '</strong> followers</span>' +
                (profile.verified ? '<span class="dot-sep">·</span><span class="cat-chip">VERIFIED</span>' : '') +
              '</div>' +
              '<div class="ac-links" style="display:flex; gap:16px; margin-top:18px;">' +
                (profile.github_url ? '<a href="' + UI.escapeHtml(profile.github_url) + '" target="_blank" rel="noopener" class="js-link">GitHub ↗</a>' : '') +
                (profile.linkedin_url ? '<a href="' + UI.escapeHtml(profile.linkedin_url) + '" target="_blank" rel="noopener" class="js-link">LinkedIn ↗</a>' : '') +
                (profile.website ? '<a href="' + UI.escapeHtml(profile.website) + '" target="_blank" rel="noopener" class="js-link">Website ↗</a>' : '') +
              '</div>' +
            '</div>' +
            '<div id="followSlot"></div>' +
          '</div>' +
        '</div>' +
        '<section class="jsection"><div class="container">' +
          '<div class="jsection-head"><div><div class="js-label">latest</div><h2>Articles <em>by</em> ' + UI.escapeHtml(name.split(' ')[0]) + '.</h2></div></div>' +
          '<div id="authorPosts"></div>' +
        '</div></section>' +
        (sorted.length > 1
          ? '<section class="jsection"><div class="container">' +
            '<div class="jsection-head"><div><div class="js-label">most read</div><h2>Popular <em>articles</em>.</h2></div></div>' +
            '<div id="authorPopular"></div></div></section>'
          : '');

      // latest list
      $('authorPosts').innerHTML = posts.length
        ? posts.map((p, i) => UI.postRow(p, i + 1)).join('')
        : UI.empty('No published articles yet.', 'When ' + name + ' publishes, it lands here.');

      // popular list
      const pop = $('authorPopular');
      if (pop) pop.innerHTML = sorted.slice(0, 5).map((p, i) => UI.postRow(p, i + 1)).join('');

      // follow button
      const me = await window.AUAuth.getUser();
      const slot = $('followSlot');
      if (me && me.id !== profile.id) {
        const following = await window.API.isFollowing(profile.id);
        slot.innerHTML = '<button class="btn-lime" id="btnFollow" style="font-size:11px; padding:12px 22px;">' +
          (following ? 'Following ✓' : '+ Follow') + '</button>';
        $('btnFollow').addEventListener('click', async () => {
          const nowOn = !$('btnFollow').classList.contains('following');
          const ok = await window.API.toggleFollow(profile.id, nowOn);
          if (ok) {
            $('btnFollow').textContent = nowOn ? 'Following ✓' : '+ Follow';
            $('btnFollow').classList.toggle('following', nowOn);
            $('btnFollow').classList.toggle('on', nowOn);
          } else UI.err(window.API.lastError || 'Could not update.');
        });
      } else if (!me) {
        slot.innerHTML = '<a class="btn-ghost-line" href="/blog/login/" style="font-size:11px; padding:12px 22px;">Sign in to follow</a>';
      }

      observeReveals();
    }

    function observeReveals() {
      window.UI.observeReveals();
    }

    boot();
  })();
  </script>
</body>
</html>
