[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  framework = "#static"
  targetPort = 5173
  publish = "dist"
  functions = "netlify/functions"

# Canonicalize to no trailing slash, matching Vercel's trailingSlash: false,
# so /work/ 308-redirects to /work instead of 404ing against the route list.
trailingSlash = "never"

# ── Legacy feedback function ──
[[redirects]]
  from = "/sendFeedback"
  to = "/.netlify/functions/sendFeedback"
  status = 200

# ── SEO endpoints (server-generated from Supabase) ──
[[redirects]]
  from = "/blog/sitemap.xml"
  to = "/.netlify/functions/journalSitemap"
  status = 200

[[redirects]]
  from = "/blog/rss.xml"
  to = "/.netlify/functions/journalRss"
  status = 200

# ── SPA routes, enumerated ──
# Every React Router route from src/App.tsx gets an explicit 200 rewrite.
# Deliberately NO catch-all: paths matching nothing fall through to Netlify's
# native custom-404 handling, which serves dist/404.html with a real HTTP 404
# status. Non-force redirects never shadow real files, so /assets, /covers and
# robots.txt are unaffected. Keep in sync with src/App.tsx —
# src/lib/spa-404-config.test.ts fails the build when they drift.

[[redirects]]
  from = "/blog/post/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/author/*"
  to = "/index.html"
  status = 200

[[redirects]]
