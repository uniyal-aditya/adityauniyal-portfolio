<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Terminal window announcing AU_ / JOURNAL">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#f0ede6" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a0a08"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- terminal window -->
  <rect x="200" y="170" width="1200" height="560" fill="#1a1a17" stroke="#f0ede6" stroke-opacity="0.14" stroke-width="2"/>
  <line x1="200" y1="242" x2="1400" y2="242" stroke="#f0ede6" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="248" cy="206" r="11" fill="none" stroke="#e8593a" stroke-width="2.5"/>
  <circle cx="288" cy="206" r="11" fill="none" stroke="#f0ede6" stroke-opacity="0.35" stroke-width="2.5"/>
  <circle cx="328" cy="206" r="11" fill="none" stroke="#c8f135" stroke-width="2.5"/>
  <text x="1370" y="214" font-family="Menlo, Consolas, monospace" font-size="22" fill="#6a6862" text-anchor="end">~/au $</text>
  <!-- typed command -->
  <text x="260" y="330" font-family="Menlo, Consolas, monospace" font-size="30" fill="#b8b5ae">~/au $</text>
  <text x="400" y="330" font-family="Menlo, Consolas, monospace" font-size="30" fill="#f0ede6">launch journal</text>
  <rect x="700" y="308" width="18" height="32" fill="#c8f135"/>
  <!-- output -->
  <text x="260" y="410" font-family="Menlo, Consolas, monospace" font-size="26" fill="#6a6862">&gt; initializing publication_</text>
  <text x="260" y="460" font-family="Menlo, Consolas, monospace" font-size="26" fill="#6a6862">&gt; status:</text>
  <text x="424" y="460" font-family="Menlo, Consolas, monospace" font-size="26" fill="#c8f135">LIVE</text>
  <!-- wordmark -->
  <text x="260" y="600" font-family="Impact, 'Arial Narrow', sans-serif" font-size="118" letter-spacing="4" fill="#f0ede6">AU_<tspan fill="#c8f135">_</tspan><tspan fill="#6a6862"> / JOURNAL</tspan></text>
  <text x="264" y="660" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#e8593a">ideas. experiments. things worth sharing.</text>
  <!-- corner tick like the scanline aesthetic -->
  <path d="M 40 60 h 60 M 40 60 v 60" stroke="#c8f135" stroke-width="3" fill="none"/>
  <path d="M 1560 840 h -60 M 1560 840 v -60" stroke="#c8f135" stroke-width="3" fill="none"/>
</svg>
