<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search — AU_ Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search the AU_ Journal — articles, authors, tags and projects.">
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/journal.css">
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <div class="scanline"></div>

  <nav class="nav stuck journal-nav" id="mainNav">
    <a href="/" class="journal-logo">AU<span class="dot">_</span><span class="slash">/</span><span class="jl">JOURNAL</span></a>
    <div class="nav-links">
      <a href="/" data-index="01">Home</a>
      <a href="/work.html" data-index="02">Work</a>
      <a href="/about.html" data-index="03">About</a>
      <a href="/blog/" data-index="04">Journal</a>
    </div>
    <div class="journal-nav-user" id="journalUser"></div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
    <a href="/">Home</a><a href="/work.html">Work</a><a href="/about.html">About</a><a href="/blog/">Journal</a>
    <div class="mobile-nav-foot">
      <a href="/blog/login/" class="btn-lime">Sign in →</a>
      <a href="/blog/dashboard/" class="btn-ghost-line">Dashboard</a>
    </div>
  </nav>

  <main>
    <div class="journal-top">
      <div class="container">
        <div class="jt-label">search</div>
        <h1>FIND <em>anything</em>.</h1>
        <form class="jsearch" id="searchForm" role="search">
          <input type="search" id="searchInput" placeholder="articles, authors, tags, projects…" aria-label="Search query" value="">
          <button class="btn-lime" type="submit" style="font-size:12px; padding:13px 22px;">Search →</button>
        </form>
        <div class="filter-bar" style="margin-top:20px">
          <span class="fb-label">Sort</span>
          <select id="fSort" aria-label="Sort results">
            <option value="relevance">Relevance</option>
            <option value="newest">Newest</option>
            <option value="most_viewed">Most viewed</option>
            <option value="most_liked">Most liked</option>
            <option value="most_bookmarked">Most bookmarked</option>
          </select>
          <span class="fb-label">Topic</span>
          <select id="fCat" aria-label="Filter by topic"><option value="">All</option></select>
          <span class="fb-label">Type</span>
          <select id="fType" aria-label="Filter by type">
            <option value="">All</option>
            <option value="article">Article</option>
            <option value="tutorial">Tutorial</option>
            <option value="guide">Guide</option>
            <option value="build_log">Build log</option>
            <option value="note">Note</option>
            <option value="case_study">Case study</option>
            <option value="project_journal">Project journal</option>
          </select>
          <span class="fb-label">Author</span>
          <input id="fAuthor" type="text" placeholder="username" style="background:var(--sand); border:1px solid var(--line); border-radius:3px; font-family:var(--f-mono); font-size:11px; color:var(--bone); padding:9px 12px; width:130px; outline:none;">
        </div>
      </div>
    </div>

    <section class="jsection">
      <div class="container">
        <div class="meta" style="margin-bottom:20px" id="resultMeta"></div>
        <div id="authorsSlot" style="margin-bottom:40px"></div>
        <div id="tagsSlot" style="margin-bottom:40px"></div>
        <div id="resultsSlot"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-left">© <span id="yr"></span> <strong>Aditya Uniyal</strong> · Built from scratch.</div>
    <div class="footer-right">
      <a href="/privacy.html">Privacy</a>
      <a href="/blog/">Journal</a>
      <a href="/blog/rss.xml">RSS</a>
      <a href="https://www.linkedin.com/in/uniyaladitya" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

  <script src="/js/supabase-config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/journal-ui.js"></script>
  <script src="/js/journal-api.js"></script>
  <script src="/js/main.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const UI = window.UI;
    let page = 0; const PAGE = 10;

    async function boot() {
      await window.AUJournalReady;
      try { const s = await window.AUAuth.getSession(); UI.renderNavUser(s.user, s.profile); } catch (e) {}

      // populate topic filter
      const cats = await window.API.categories();
      $('fCat').innerHTML = '<option value="">All</option>' +
        (cats || []).map(c => '<option value="' + UI.escapeHtml(c.slug) + '">' + UI.escapeHtml(c.name) + '</option>').join('');

      $('searchForm').addEventListener('submit', e => { e.preventDefault(); page = 0; run(); });
      ['fSort', 'fCat', 'fType'].forEach(id => $(id).addEventListener('change', () => { page = 0; run(); }));
      $('fAuthor').addEventListener('change', () => { page = 0; run(); });

      // preload from querystring
      const q = UI.qs('q');
      if (q) { $('searchInput').value = q; run(); } else { run(); }
    }

    async function run() {
      const q = $('searchInput').value.trim();
      const opts = {
        q,
        sort: $('fSort').value,
        category: $('fCat').value || null,
        type: $('fType').value || null,
        author: $('fAuthor').value.trim() || null,
        limit: PAGE,
        offset: page * PAGE,
      };
      $('resultMeta').textContent = 'searching…';
      const res = await window.API.search(opts);
      if (page === 0) {
        $('resultsSlot').innerHTML = '';
        $('authorsSlot').innerHTML = '';
        $('tagsSlot').innerHTML = '';
        $('resultMeta').textContent = res.posts.length
          ? res.posts.length + ' result' + (res.posts.length === 1 ? '' : 's') + (q ? ' for “' + q + '”' : '')
          : (q ? 'No results for “' + q + '”.' : 'Showing all published articles.');
      }
      if (!res.posts.length && page === 0) {
        $('resultsSlot').innerHTML = UI.empty('No data yet.', 'Try a different search or clear the filters.');
      } else {
        $('resultsSlot').insertAdjacentHTML('beforeend', res.posts.map((p, i) => UI.postRow(p, page * PAGE + i + 1)).join(''));
      }
      // authors
      if (res.authors && res.authors.length && page === 0) {
        $('authorsSlot').innerHTML =
          '<div class="js-label" style="font-family:var(--f-mono); font-size:10px; color:var(--lime); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:14px;">AUTHORS</div>' +
          '<div class="writers-grid">' + res.authors.map(a => UI.writerCard(a)).join('') + '</div>';
      }
      // tags
      if (res.tags && res.tags.length && page === 0) {
        $('tagsSlot').innerHTML =
          '<div class="js-label" style="font-family:var(--f-mono); font-size:10px; color:var(--lime); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:14px;">TAGS</div>' +
          '<div class="tag-cloud">' + res.tags.map(t =>
            '<a class="topic-pill" href="/blog/search/?q=' + encodeURIComponent(t.name) + '">#' + UI.escapeHtml(t.name) + '</a>').join('') + '</div>';
      }
      // load more
      let more = $('loadMoreBtn');
      if (res.posts.length === PAGE) {
        if (!more) {
          more = document.createElement('button');
          more.id = 'loadMoreBtn';
          more.className = 'btn-ghost-line';
          more.textContent = 'Load more ↓';
          more.style.marginTop = '32px';
          more.addEventListener('click', () => { page++; run(); });
          $('resultsSlot').after(more);
        }
        more.hidden = false;
      } else if (more) more.hidden = true;
    }

    boot();
  })();
  </script>
</body>
</html>
